# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name pdfexel.ru www.pdfexel.ru;
    return 301 https://pdfexel.ru$request_uri;
}

# www → apex
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.pdfexel.ru;

    ssl_certificate /etc/letsencrypt/live/pdfexel.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pdfexel.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://pdfexel.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pdfexel.ru;

    ssl_certificate /etc/letsencrypt/live/pdfexel.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pdfexel.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/pdfexel.ru;
    index index.html;
    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://80.87.196.33:8133/;
        proxy_read_timeout 240s;
        proxy_connect_timeout 10s;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location = /a {
        try_files /a/index.html =404;
    }

    location ~* \.(css|js|ico|svg|png|jpg|webp|woff2)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
