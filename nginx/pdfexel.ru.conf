# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name pdfexel.ru www.pdfexel.ru;
    return 301 https://pdfexel.ru$request_uri;
}

# www → apex
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.pdfexel.ru;

    ssl_certificate /etc/letsencrypt/live/pdfexel.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pdfexel.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://pdfexel.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pdfexel.ru;

    ssl_certificate /etc/letsencrypt/live/pdfexel.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pdfexel.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/pdfexel.ru;
    index index.html;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location = /a {
        try_files /a/index.html =404;
    }

    location ~* \.(css|js|ico|svg|png|jpg|webp|woff2)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
