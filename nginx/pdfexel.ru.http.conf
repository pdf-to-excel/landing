server {
    listen 80;
    listen [::]:80;
    server_name pdfexel.ru www.pdfexel.ru;
    root /var/www/pdfexel.ru;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/pdfexel.ru;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location = /a {
        try_files /a/index.html =404;
    }
}
